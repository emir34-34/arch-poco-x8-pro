# klee: makepkg on the PC producing aarch64 packages for the phone
source /etc/makepkg.conf
CARCH="aarch64"
CHOST="aarch64-unknown-linux-gnu"
export CC=/home/administrator/klee-ut/arch/xenv/bin/aarch64-cc CXX=/home/administrator/klee-ut/arch/xenv/bin/aarch64-c++ AR=/home/administrator/klee-ut/arch/xenv/bin/aarch64-ar RANLIB=/home/administrator/klee-ut/arch/xenv/bin/aarch64-ranlib NM=/home/administrator/klee-ut/arch/xenv/bin/aarch64-nm
export PKG_CONFIG=/home/administrator/klee-ut/arch/xenv/bin/aarch64-pkg-config
export PATH=/home/administrator/klee-ut/arch/xenv/shims:/home/administrator/klee-ut/arch/venv/bin:$PATH
CFLAGS="-O2 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection -fstack-protector-strong"
CXXFLAGS="$CFLAGS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now"
LTOFLAGS=""
DEBUG_CFLAGS=""
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto)
BUILDENV=(!distcc color !ccache !check !sign)
PKGDEST=/home/administrator/klee-ut/arch/repo
PACKAGER="klee port"
export KLEE_SYSROOT=/home/administrator/klee-ut/arch/sysroot
export KLEE_XENV=/home/administrator/klee-ut/arch/xenv
