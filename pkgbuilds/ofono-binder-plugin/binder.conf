[Settings]
# klee: the vendor exposes the radio as AIDL services on /dev/binder
Device=/dev/binder
InterfaceType=aidl
ExpectSlots=slot1,slot2

# signalStrengthRange: LTE RSRP indoors is often -105..-115 dBm, which the
# default -100,-60 maps to 0-1% (no bars); -125,-75 is closer to the LTE
# levels Android uses

[slot1]
path=/ril_0
slot=0
signalStrengthRange=-125,-75

[slot2]
path=/ril_1
slot=1
signalStrengthRange=-125,-75
