# klee: apps draw without the GPU for now (phoc renders with pixman, and
# libglvnd would otherwise hand GTK the libhybris EGL, which cannot draw into
# Wayland buffers yet): Mesa's software EGL, GTK4 with cairo, GTK3 without GL
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
GSK_RENDERER=cairo
GDK_GL=disable
