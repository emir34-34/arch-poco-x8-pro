# klee: keep trying while Android's Bluetooth HAL comes up (never give up
# after 5 quick restarts)
[Unit]
StartLimitIntervalSec=0

# /dev/vhci comes from the hci_vhci module of our kernel
[Service]
ExecStartPre=-/usr/bin/modprobe hci_vhci
# MediaTek's controller claims Synchronization Train support (LMP features
# page 2, byte 0, 0x04) but rejects HCI_Read_Synchronization_Train_Parameters,
# and the kernel's bluetooth stack then aborts the HCI init
Environment=BLUEBINDER_LOCAL_EXT_FEATURES_PAGE_2_MASK=0400000000000000
# Waiting for Android's Bluetooth HAL must not hold the boot: under Ubuntu
# Touch the start timeout (Type=notify + bluebinder_wait.sh) kept
# multi-user.target waiting until 80 s. Wait inside the main process instead.
Type=simple
RestartSec=3
ExecStartPre=
ExecStartPre=-/usr/bin/modprobe hci_vhci
ExecStart=
ExecStart=/bin/sh -c '/usr/bin/droid/bluebinder_wait.sh; exec /usr/bin/bluebinder'
