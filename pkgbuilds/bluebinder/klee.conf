# klee: /dev/vhci comes from the hci_vhci module of our kernel
[Service]
ExecStartPre=-/usr/bin/modprobe hci_vhci
# MediaTek's controller claims Synchronization Train support (LMP features
# page 2, byte 0, 0x04) but rejects HCI_Read_Synchronization_Train_Parameters,
# and the kernel's bluetooth stack then aborts the HCI init
Environment=BLUEBINDER_LOCAL_EXT_FEATURES_PAGE_2_MASK=0400000000000000
